name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.1"
        required: true
        default: "v0.1.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            $version = "${{ github.ref_name }}"
          }
          $plainVersion = $version.TrimStart("v")
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "POWERSOUND_VERSION=$plainVersion" >> $env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish PowerSound
        shell: pwsh
        run: |
          dotnet publish PowerSound.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:Version=${env:POWERSOUND_VERSION} `
            /p:FileVersion=${env:POWERSOUND_VERSION} `
            /p:InformationalVersion=${env:RELEASE_VERSION} `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            -o publish/win-x64

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path publish/win-x64/PowerSound.exe -DestinationPath artifacts/PowerSound-Portable.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" Installer/PowerSound.iss

      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $escapedVersion = [regex]::Escape($version)
          $changelog = Get-Content -Raw -Path CHANGELOG.md
          $pattern = "(?ms)^##\s+$escapedVersion\s*\r?\n(?<body>.*?)(?=^##\s+|\z)"
          $match = [regex]::Match($changelog, $pattern)

          if ($match.Success) {
            $whatsNew = $match.Groups["body"].Value.Trim()
          } else {
            $whatsNew = "- See the commit history for changes in this release."
          }

          $releaseNotes = @"
          PowerSound adds customizable sounds and optional notifications for charger and battery events on Windows.

          ## What's New

          $whatsNew

          ## System Requirements

          PowerSound is intended for 64-bit Windows 10 and Windows 11.

          PowerSound has been tested on Windows 11. Windows 10 should also work, but has not yet been tested.

          ## Download

          For most users, download and run ``PowerSound-Setup.exe``.

          Prefer not to install it? Download ``PowerSound-Portable.zip``, unzip it, and run ``PowerSound.exe``.

          Windows may show a SmartScreen warning because PowerSound is not digitally signed yet.
          "@

          $releaseNotes = $releaseNotes -replace "(?m)^          ", ""
          Set-Content -Path RELEASE_NOTES.md -Value $releaseNotes -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PowerSound-windows
          path: |
            artifacts/PowerSound-Setup.exe
            artifacts/PowerSound-Portable.zip

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: PowerSound ${{ env.RELEASE_VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/PowerSound-Setup.exe
            artifacts/PowerSound-Portable.zip
